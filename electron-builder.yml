appId: com.crsc-assistant.app
productName: CRSC Filing Assistant
directories:
  output: release
  buildResources: resources

mac:
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.productivity
  icon: resources/icon.icns

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"
      - "!icon.icns"

files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*"
